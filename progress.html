<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e21b2d"><title>My Progress | Comic Orders</title><style>

.controls{display:grid;grid-template-columns:1fr 150px 150px;gap:8px}.input,.select,.btn{border:1px solid var(--line);background:#0c1425;color:var(--text);border-radius:11px;padding:10px;font:inherit}.input{width:100%}.btn{cursor:pointer;font-weight:800}.primary{background:var(--red);border-color:var(--red)}

.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:#0c1425;color:#dfe5f1;border-radius:99px;padding:6px 9px;font-size:12px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}.issue{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#0d1527;border:1px solid transparent;border-radius:11px}.issue:hover{border-color:var(--line)}.issue.done{opacity:.52}.issue.done .name{text-decoration:line-through}.issue input{width:19px;height:19px;accent-color:var(--red);margin-top:2px}.issue-info{flex:1;min-width:0;cursor:pointer}.name{font-weight:700}.meta{font-size:11px;color:var(--muted);margin-top:3px}

.modal-box{position:relative;width:min(620px,100%);max-height:90vh;overflow-y:auto;background:#111a2d;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.6)}

body::before{content:"";position:fixed;inset:-24px;z-index:-3;background-image:var(--library-bg);background-size:cover;background-position:center top;background-repeat:no-repeat;filter:blur(2px);transform:scale(1.035);opacity:.88;transition:opacity .25s ease}body::after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(5,9,18,.68),rgba(5,9,18,.82));pointer-events:none}.hero-card:not(.active){filter:saturate(.75);opacity:.86}.hero-card:not(.active):hover{filter:saturate(1);opacity:1}.hero-card.active .hero-image{box-shadow:inset 0 -4px 0 #e21b2d}

.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}

</style></head><body id="appBody"><main class="wrap">
<nav class="nav">
<a href="index.html" class="">Home</a>
<a href="reading-orders.html" class="">📚 Reading Orders</a>
<a href="progress.html" class="active">📊 My Progress</a>
<a href="milestones.html" class="">🏆 Milestones</a>
</nav><header class="page-head"><div class="eyebrow">Comic Orders</div><h1 class="page-title">My Progress</h1><p class="page-subtitle">See your reading progress across every Comic Orders library in one place.</p></header>
<section class="card"><div class="kpi"><div class="stat"><div class="big" id="totalRead">0</div><div class="small">TOTAL READ</div></div><div class="stat"><div class="big" id="totalEntries">0</div><div class="small">TOTAL ENTRIES</div></div><div class="stat"><div class="big" id="overallPct">0%</div><div class="small">OVERALL</div></div><div class="stat"><div class="big" id="runsDone">0</div><div class="small">RUNS FINISHED</div></div></div></section>
<section class="progress-grid" id="progressGrid"></section>
</main><div id="toast" class="toast"></div><script>
const LIBRARIES = [{"id":"spider-man","name":"Spider-Man","kind":"Hero","data":"data.json","image":"images/spider-man.jpg","background":"backgrounds/spider-man.jpg","description":"Spider-Man reading checklist."},{"id":"ultimate-spider-man","name":"Ultimate Spider-Man","kind":"Alternate Universe","data":"ultimate-spider-man-2000s-affiliate-ready.json","image":"images/ultimate-spider-man.jpg","background":"backgrounds/ultimate-spider-man.jpg","description":"The 2000s Ultimate Universe Spider-Man reading order."},{"id":"x-men","name":"X-Men","kind":"Team","data":"x-men.json","image":"images/x-men.jpeg","background":"backgrounds/x-men.jpeg","description":"X-Men reading checklist."},{"id":"avengers","name":"Avengers","kind":"Team","data":"avengers.json","image":"images/avengers.jpg","background":"backgrounds/avengers.jpg","description":"Avengers reading checklist."},{"id":"fantastic-four","name":"Fantastic Four","kind":"Team","data":"fantastic-four.json","image":"images/fantastic-four.jpg","background":"backgrounds/fantastic-four.jpg","description":"Fantastic Four reading checklist."},{"id":"daredevil","name":"Daredevil","kind":"Hero","data":"daredevil.json","image":"images/daredevil.webp","background":"backgrounds/daredevil.webp","description":"Daredevil reading checklist."}];
const MILESTONES = [
 {id:'first',icon:'🕷️',name:'Origin Story',desc:'Read your first comic.',target:1},
 {id:'ten',icon:'📚',name:'If This Be My Destiny...',desc:'Read 10 comics.',target:10},
 {id:'fifty',icon:'🔥',name:'Prospect',desc:'Read 50 comics.',target:50},
 {id:'hundred',icon:'💯',name:'Full-Blown Hero',desc:'Read 100 comics.',target:100},
 {id:'twofifty',icon:'🏆',name:'Defender',desc:'Read 250 comics.',target:250},
 {id:'fivehundred',icon:'💎',name:'Legend',desc:'Read 500 comics.',target:500},
 {id:'thousand',icon:'👑',name:'Avenger',desc:'Read 1,000 comics.',target:1000},
 {id:'completionist',icon:'👁️',name:'The Watcher',desc:'Finish an entire reading order.',type:'library'}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const activeId=localStorage.getItem('activeMarvelLibrary')||'spider-man';
const key=id=>'marvelProgress:'+id;
function saved(id){const s=JSON.parse(localStorage.getItem(key(id))||'{}');s.done=s.done||{};s.status=s.status||{};s.goal=s.goal||100;s.milestones=s.milestones||[];return s}
function save(id,s){localStorage.setItem(key(id),JSON.stringify(s))}
function readCount(data,s){return data.reduce((n,x)=>n+(s.done[x.id]?1:0),0)}
function nextUnread(data,s){return data.find(x=>!s.done[x.id])||null}
function progressFor(data,s){const read=readCount(data,s);return {read,total:data.length,pct:data.length?Math.round(read/data.length*100):0,goalPct:Math.min(100,Math.round(read/Math.max(1,s.goal)*100)),next:nextUnread(data,s)}}
async function loadLibrary(lib){const r=await fetch(lib.data,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+lib.data);return r.json()}
async function allProgress(){return Promise.all(LIBRARIES.map(async lib=>{try{const data=await loadLibrary(lib),s=saved(lib.id),p=progressFor(data,s);return {...lib,data,s,p}}catch(e){return {...lib,data:[],s:saved(lib.id),p:{read:0,total:0,pct:0,goalPct:0,next:null},error:true}}}))}
function go(page,id){let url=page+'.html';if(id)url+='?library='+encodeURIComponent(id);location.href=url}
function libraryFromQuery(){return new URLSearchParams(location.search).get('library')||activeId}
function currentMilestones(read,data,s){return MILESTONES.filter(m=>m.type==='library'?data.length&&read>=data.length:read>=m.target)}
function showToast(name,text){const t=$('toast');if(!t)return;t.innerHTML='<b>'+esc(name)+'</b><span>'+esc(text)+'</span>';t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
</script>
<script>
async function renderProgress(){
 const rows=await allProgress();let read=0,total=0,done=0;
 $('progressGrid').innerHTML=rows.map(r=>{read+=r.p.read;total+=r.p.total;if(r.p.total&&r.p.read===r.p.total)done++;return `<div class="card"><div class="eyebrow">${esc(r.kind)}</div><h2 style="margin:5px 0 8px">${esc(r.name)}</h2><div class="small">${r.p.read.toLocaleString()} / ${r.p.total.toLocaleString()} read</div><div class="bar"><div class="fill" style="width:${r.p.pct}%"></div></div><div class="pills"><span class="pill">${r.p.pct}% complete</span><span class="pill">${r.p.goalPct}% of goal</span></div><div class="quick"><a class="primary" href="reading-orders.html?library=${encodeURIComponent(r.id)}">${r.p.next?'Continue':'View run'}</a></div></div>`}).join('');
 $('totalRead').textContent=read.toLocaleString();$('totalEntries').textContent=total.toLocaleString();$('overallPct').textContent=(total?Math.round(read/total*100):0)+'%';$('runsDone').textContent=done;
}
renderProgress();
</script>
