<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e21b2d">
<title>Marvel Reading Orders | Comic Orders</title>
<meta name="description" content="Browse Marvel reading orders for Spider-Man, Ultimate Spider-Man, X-Men, Avengers, Fantastic Four and Daredevil.">
<style>
:root{--bg:#080d19;--p:#111a2d;--p2:#17223a;--line:#293754;--text:#f7f8fc;--muted:#9aa8c2;--red:#e21b2d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
body{position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-24px;z-index:-2;background:url("background.jpg") center/cover fixed no-repeat;filter:brightness(.3)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(5,9,18,.72),rgba(5,9,18,.94))}
.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0 60px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav a{display:inline-block;text-decoration:none;color:var(--text);background:#111a2d;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-weight:900}
.nav a.active{background:var(--red);border-color:var(--red)}
.eyebrow{color:#ff6875;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.title{font-size:clamp(42px,8vw,68px);line-height:.92;margin:7px 0 12px;font-weight:950}
.lead{color:var(--muted);font-size:18px;line-height:1.55;max-width:760px}
.card{background:#111a2df2;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:18px}
.library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.order-card{display:block;text-decoration:none;color:var(--text);background:#0d1527;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.order-card:hover{transform:translateY(-3px);border-color:var(--red);box-shadow:0 12px 35px rgba(0,0,0,.3)}
.order-image{height:230px;overflow:hidden;background:#17223a}
.order-image img{display:block;width:100%;height:100%;object-fit:cover}
.order-body{padding:15px}
.order-kind{font-size:11px;color:#ff6875;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
.order-name{font-size:24px;font-weight:950;margin-top:4px}
.order-desc{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}
.order-status{font-size:12px;color:#b9c5dc;margin-top:10px}
.open{display:inline-block;margin-top:13px;background:var(--red);border-radius:10px;padding:9px 12px;font-weight:900;font-size:13px;color:#fff}
.error{color:#ff6875;padding:18px;text-align:center}
@media(max-width:650px){.library-grid{grid-template-columns:1fr}.order-image{height:220px}}
</style>
</head>
<body>
<main class="wrap">
<nav class="nav">
<a href="index.html">Home</a>
<a class="active" href="reading-orders.html">📚 Reading Orders</a>
<a href="progress.html">📊 My Progress</a>
<a href="milestones.html">🏆 Milestones</a>
</nav>

<header>
<div class="eyebrow">Comic Orders</div>
<h1 class="title">Reading Orders</h1>
<p class="lead">Choose a hero, team or universe and dive into its reading checklist.</p>
</header>

<section class="card">
<div id="library-grid" class="library-grid">
<div class="error">Loading reading orders…</div>
</div>
</section>
</main>

<script>
const specialOrders = {
  "ultimate-spider-man": {
    id:"ultimate-spider-man",
    name:"Ultimate Spider-Man",
    kind:"Alternate Universe",
    ready:true,
    image:"ultimate-spider-man.jpg",
    count:154
  }
};

const fallbackOrders = [
  {id:"spider-man",name:"Spider-Man",kind:"Hero",ready:true,image:"spider-man.jpg",count:1232},
  specialOrders["ultimate-spider-man"]
];

function assetPath(value, fallback){
  if(!value) return fallback || "";
  // library.json currently points to images/foo.jpg and backgrounds/foo.jpg,
  // while the repository stores the image files at its root.
  return value.split("/").pop();
}

function renderOrders(library){
  const byId = new Map(library.map(x => [x.id,x]));
  const orders = [...library];

  // Keep Ultimate Spider-Man available even though it is not in library.json.
  if(!byId.has("ultimate-spider-man")) {
    const pos = orders.findIndex(x => x.id === "spider-man");
    orders.splice(pos >= 0 ? pos + 1 : 1, 0, specialOrders["ultimate-spider-man"]);
  }

  // Keep the existing useful order of the site.
  const preferred = ["spider-man","ultimate-spider-man","x-men","avengers","fantastic-four","daredevil"];
  orders.sort((a,b) => preferred.indexOf(a.id) - preferred.indexOf(b.id));

  document.getElementById("library-grid").innerHTML = orders.map(order => {
    const image = assetPath(order.image, "cover.webp");
    const count = Number(order.count || 0);
    const status = count ? `${count.toLocaleString()} issues` : "Reading order available";
    const position = order.id === "spider-man" ? "center 28%" : "center";

    return `
      <a class="order-card" href="index.html?library=${encodeURIComponent(order.id)}">
        <div class="order-image">
          <img src="${image}" alt="${escapeHtml(order.name)}" style="object-position:${position}" loading="lazy"
               onerror="this.onerror=null;this.src='cover.webp'">
        </div>
        <div class="order-body">
          <div class="order-kind">${escapeHtml(order.kind || "Reading Order")}</div>
          <div class="order-name">${escapeHtml(order.name)}</div>
          <div class="order-desc">${escapeHtml(order.name)} reading checklist.</div>
          <div class="order-status">${status}</div>
          <span class="open">Open reading order →</span>
        </div>
      </a>`;
  }).join("");
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

fetch("library.json", {cache:"no-store"})
  .then(response => {
    if(!response.ok) throw new Error("library.json returned " + response.status);
    return response.json();
  })
  .then(data => renderOrders(Array.isArray(data) ? data : fallbackOrders))
  .catch(error => {
    console.error(error);
    renderOrders(fallbackOrders);
  });
</script>
</body>
</html>
