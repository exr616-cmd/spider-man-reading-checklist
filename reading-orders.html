const MILESTONES = [
 {id:'first',icon:'🕷️',name:'Origin Story',desc:'Read your first comic.',target:1},
 {id:'ten',icon:'📚',name:'If This Be My Destiny...',desc:'Read 10 comics.',target:10},
 {id:'fifty',icon:'🔥',name:'Prospect',desc:'Read 50 comics.',target:50},
 {id:'hundred',icon:'💯',name:'Full-Blown Hero',desc:'Read 100 comics.',target:100},
 {id:'twofifty',icon:'🏆',name:'Defender',desc:'Read 250 comics.',target:250},
 {id:'fivehundred',icon:'💎',name:'Legend',desc:'Read 500 comics.',target:500},
 {id:'thousand',icon:'👑',name:'Avenger',desc:'Read 1,000 comics.',target:1000},
 {id:'completionist',icon:'👁️',name:'The Watcher',desc:'Finish an entire reading order.',type:'library'}
];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const key=id=>'marvelProgress:'+id;
function saved(id){const s=JSON.parse(localStorage.getItem(key(id))||'{}');s.done=s.done||{};s.status=s.status||{};s.goal=s.goal||100;s.milestones=s.milestones||[];return s}
function save(id,s){localStorage.setItem(key(id),JSON.stringify(s))}
function readCount(data,s){return data.reduce((n,x)=>n+(s.done[x.id]?1:0),0)}
function nextUnread(data,s){return data.find(x=>!s.done[x.id])||null}
function progressFor(data,s){const read=readCount(data,s);return {read,total:data.length,pct:data.length?Math.round(read/data.length*100):0,goalPct:Math.min(100,Math.round(read/Math.max(1,s.goal)*100)),next:nextUnread(data,s)}}
async function loadLibrary(lib){const r=await fetch(lib.data,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+lib.data);return r.json()}
async function allProgress(){return Promise.all(LIBRARIES.map(async lib=>{try{const data=await loadLibrary(lib),s=saved(lib.id),p=progressFor(data,s);return {...lib,data,s,p}}catch(e){return {...lib,data:[],s:saved(lib.id),p:{read:0,total:0,pct:0,goalPct:0,next:null},error:true}}}))}

function fill(id,vals,label){const el=$(id),u=[...new Set(vals.map(v=>v||'Unknown'))].sort((a,b)=>a.localeCompare(b));el.innerHTML='<option value="all">'+label+'</option>'+u.map(v=>`<option>${esc(v)}</option>`).join('')}
function status(x){return s.status[x.id]||'unread'}
function filtered(){const q=$('search').value.toLowerCase();return data.filter(x=>{const st=status(x);return(!q||(x.name||'').toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q))&&(['category','decade','title','writer','artist','storyline'].every(k=>$(k).value==='all'||String(x[k]||'Unknown')===$(k).value))&&($('status').value==='all'||st===$('status').value)&&($('importance').value==='all'||x.statusType===$('importance').value)&&($('universe').value==='all'||x.universe===$('universe').value)})}
function showIssue(x){const m=$('issueModal');const links=Array.isArray(x.readLinks)?x.readLinks.map(l=>`<a class="source-button" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(''):'';m.innerHTML=`<div class="modal-box"><button class="modal-close" onclick="closeIssue()">×</button><div class="eyebrow">Issue details</div><h2>${esc(x.name)}</h2><div class="modal-meta">${esc(x.title||'Unknown')}${x.decade?' • '+esc(x.decade):''}</div>${x.writer?`<p><b>Writer:</b> ${esc(x.writer)}</p>`:''}${x.artist?`<p><b>Artist:</b> ${esc(x.artist)}</p>`:''}${x.storyline?`<p><b>Storyline:</b> ${esc(x.storyline)}</p>`:''}<h3>Read / find this issue</h3><div class="source-buttons">${links}<a class="source-button" href="https://www.marvel.com/search?q=${encodeURIComponent(x.name)}" target="_blank" rel="noopener">Search Marvel</a><a class="source-button" href="https://www.marvel.com/unlimited/search?query=${encodeURIComponent(x.name)}" target="_blank" rel="noopener">Search Marvel Unlimited</a><a class="source-button alt" href="https://www.google.com/search?q=${encodeURIComponent(x.name+' comic')}" target="_blank" rel="noopener">Find other legitimate editions</a></div>${x.amazonUrl?`<div class="amazon-affiliate"><div class="amazon-affiliate-title">Buy / collect this issue</div><div class="source-buttons"><a class="source-button amazon-button" href="${esc(x.amazonUrl)}" target="_blank" rel="noopener sponsored">Amazon UK <span>(paid link)</span></a></div><div class="amazon-affiliate-note">As an Amazon Associate I earn from qualifying purchases.</div></div>`:''}${x.masterworks?`<div class="masterworks-box"><div class="masterworks-title">Collected in</div><div>${esc(x.masterworks.name)}</div><div class="source-buttons" style="margin-top:9px"><a class="source-button amazon-button" href="${esc(x.masterworks.amazonUrl)}" target="_blank" rel="noopener sponsored">Amazon UK <span>(paid link)</span></a></div></div>`:''}</div>`;m.classList.add('open')}
function closeIssue(){$('issueModal').classList.remove('open')}
async function load(){libId=libraryFromQuery();s=saved(libId);const lib=LIBRARIES.find(x=>x.id===libId)||LIBRARIES[0];$('library').innerHTML=LIBRARIES.map(x=>`<option value="${x.id}" ${x.id===lib.id?'selected':''}>${esc(x.name)}</option>`).join('');$('orderTitle').textContent=lib.name;data=await loadLibrary(lib);data.forEach(derive);['category','decade','title','writer','artist','storyline'].forEach(k=>fill(k,data.map(x=>x[k]),'All '+k.replace('storyline','storylines')));$('goal').value=s.goal;$('goalLabel').textContent=s.goal;render()}
function render(){const a=filtered();if($('sort').value==='alpha')a.sort((x,y)=>x.name.localeCompare(y.name));const p=progressFor(data,s);$('read').textContent=p.read.toLocaleString();$('pct').textContent=p.pct+'%';$('goalPct').textContent=p.goalPct+'%';$('left').textContent=Math.max(0,s.goal-p.read).toLocaleString();$('fill').style.width=p.pct+'%';$('summary').textContent=`${p.read.toLocaleString()} read • ${p.total.toLocaleString()} total entries`;$('count').textContent=`Showing ${a.length.toLocaleString()} of ${data.length.toLocaleString()}`;$('list').innerHTML=a.map(x=>{const done=!!s.done[x.id];return `<div class="issue ${done?'done':''}" data-id="${esc(x.id)}"><input class="issue-checkbox" type="checkbox" ${done?'checked':''}><span class="spider-check"></span><div class="issue-info"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.title)} • ${esc(x.decade)} • ${esc(status(x))} • ${esc(x.statusType)}</div>${x.storyline?`<div class="meta">Storyline: ${esc(x.storyline)}</div>`:''}</div></div>`}).join('')||'<div class="empty">Nothing matches these filters.</div>';document.querySelectorAll('[data-id]').forEach(row=>{const cb=row.querySelector('input');row.onclick=e=>{if(e.target===cb||e.target.classList.contains('spider-check'))return;showIssue(data.find(x=>x.id===row.dataset.id))};row.querySelector('.spider-check').onclick=e=>{e.stopPropagation();cb.checked=!cb.checked;toggle(cb)};cb.onchange=()=>toggle(cb)});$('goal').value=s.goal;$('goalLabel').textContent=s.goal}
function toggle(cb){const before=currentMilestones(readCount(data,s),data,s).map(x=>x.id);s.done[data.find(x=>x.id===cb.closest('[data-id]').dataset.id).id]=cb.checked;s.status[cb.closest('[data-id]').dataset.id]=cb.checked?'read':'unread';save(libId,s);render();const after=currentMilestones(readCount(data,s),data,s).map(x=>x.id);const fresh=MILESTONES.filter(m=>after.includes(m.id)&&!before.includes(m.id));fresh.forEach(m=>showToast(m.icon+' '+m.name,m.desc))}
['search','sort','category','decade','title','writer','artist','storyline','status','importance','universe'].forEach(id=>$(id).oninput=$(id).onchange=render);
$('goal').oninput=()=>{s.goal=Math.max(1,+$('goal').value||1);save(libId,s);render()};
$('clearFilters').onclick=()=>{['category','decade','title','writer','artist','storyline','status','importance','universe'].forEach(id=>$(id).value='all');$('search').value='';render()};
$('clear').onclick=()=>{if(confirm('Clear all progress for this reading order?')){s.done={};s.status={};save(libId,s);render()}};
$('next').onclick=()=>{const x=nextUnread(data,s);if(!x)return;s.status[x.id]='reading';save(libId,s);location.hash=x.id;render();setTimeout(()=>document.querySelector(`[data-id="${CSS.escape(x.id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),50)};
$('library').onchange=e=>{localStorage.setItem('activeMarvelLibrary',e.target.value);location.href='reading-orders.html?library='+encodeURIComponent(e.target.value)};
load();
</script>
</body></html>
