<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Comic Orders</title><style>
:root{--bg:#080d19;--p:#111a2d;--p2:#17223a;--line:#293754;--text:#f7f8fc;--muted:#9aa8c2;--red:#e21b2d;--gold:#ffd45a;--green:#55e69a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
body{position:relative;overflow-x:hidden}body:before{content:"";position:fixed;inset:-24px;z-index:-2;background:url("background.jpg") center/cover fixed no-repeat;filter:brightness(.28)}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(5,9,18,.72),rgba(5,9,18,.96))}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:20px 0 70px}
.top-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.top-nav a{display:inline-block;text-decoration:none;color:var(--text);background:#111a2d;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:900}.top-nav a.active{background:var(--red);border-color:var(--red)}
.eyebrow{color:#ff6875;font-weight:900;letter-spacing:.11em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(42px,8vw,70px);line-height:.92;margin:7px 0 12px;font-weight:950}.lead{color:var(--muted);font-size:18px;line-height:1.5}.card{background:#111a2df2;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}.section-title{font-size:27px;font-weight:950;margin:4px 0}.small{font-size:12px;color:var(--muted);line-height:1.45}.btn{display:inline-block;text-decoration:none;color:#fff;background:var(--red);border:1px solid var(--red);border-radius:10px;padding:9px 13px;font-weight:900}
</style><style>
.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:#17223a;border-radius:15px;padding:15px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.list{display:grid;gap:9px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px;background:#0d1527;border:1px solid #293754;border-radius:12px;padding:11px}.row-main{min-width:0}.row-name{font-weight:900;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:11px;margin-top:3px}.score{color:#ffd45a;font-weight:950;white-space:nowrap}.milestones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.mile{background:#0d1527;border:1px solid #293754;border-radius:14px;padding:13px}.mile.unlocked{border-color:#e21b2d}.mile-name{font-weight:950;margin-top:4px}.mile-desc,.status{color:var(--muted);font-size:11px;margin-top:3px}.bar{height:7px;background:#080e1b;border:1px solid #293754;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,#e21b2d,#ff6571)}@media(max-width:700px){.profile{grid-template-columns:repeat(2,1fr)}.lists,.milestones{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<nav class="top-nav"><a href="index.html">Home</a><a href="reading-orders.html">📚 Reading Orders</a><a class="active" href="profile.html">👤 Profile</a></nav>
<div class="eyebrow">Comic Orders</div><h1>My Profile</h1><p class="lead">Your reading stats, achievements, favourites and ratings.</p>
<section class="card"><div class="profile"><div class="stat"><b id="read">0</b><span>Comics read</span></div><div class="stat"><b id="rated">0</b><span>Issues rated</span></div><div class="stat"><b id="avg">—</b><span>Average rating</span></div><div class="stat"><b id="runs">0</b><span>Runs completed</span></div></div></section>
<section class="card"><div class="section-title">🏆 Milestones</div><div id="milestones" class="milestones"></div></section>
<div class="lists"><section class="card"><div class="section-title">🥇 Top 3 Issues</div><div id="top" class="list"></div></section><section class="card"><div class="section-title">💀 Bottom 3 Issues</div><div id="bottom" class="list"></div></section></div>
</main><script>
const libs=[['spider-man','Spider-Man','data.json'],['ultimate-spider-man','Ultimate Spider-Man','ultimate-spider-man-2000s.json'],['x-men','X-Men','x-men.json'],['avengers','Avengers','avengers.json'],['fantastic-four','Fantastic Four','fantastic-four.json'],['daredevil','Daredevil','daredevil.json']];
const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=(k,d={})=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
async function run(){
 const all=[];
 for(const [id,name,file] of libs){try{const d=await (await fetch(file,{cache:'no-store'})).json();const p=get('marvelProgress:'+id,{}),r=get('marvelRatings:'+id,{}),done=p.done||{};d.forEach(x=>all.push({...x,lib:id,libName:name,read:!!done[x.id],rating:r[x.id]??''}))}catch(e){}}
 const read=all.filter(x=>x.read),rated=all.filter(x=>x.rating!==''&&Number.isFinite(Number(x.rating)));
 $('read').textContent=read.length.toLocaleString();$('rated').textContent=rated.length.toLocaleString();
 $('avg').textContent=rated.length?(rated.reduce((a,x)=>a+Number(x.rating),0)/rated.length).toFixed(1):'—';
 $('runs').textContent=libs.filter(([id])=>{const a=all.filter(x=>x.lib===id);return a.length&&a.every(x=>x.read)}).length;
 const row=x=>'<div class="row"><div class="row-main"><div class="row-name">'+esc(x.name)+'</div><div class="meta">'+esc(x.libName)+'</div></div><div class="score">'+Number(x.rating).toFixed(1)+' ⭐</div></div>';
 $('top').innerHTML=rated.slice().sort((a,b)=>Number(b.rating)-Number(a.rating)).slice(0,3).map(row).join('')||'<div class="status">Rate issues to build your Top 3.</div>';
 $('bottom').innerHTML=rated.slice().sort((a,b)=>Number(a.rating)-Number(b.rating)).slice(0,3).map(row).join('')||'<div class="status">Rate issues to build your Bottom 3.</div>';
 const miles=[['🕷️','Origin Story','Read your first comic.',1],['📚','If This Be My Destiny...','Read 10 comics.',10],['🔥','Prospect','Read 50 comics.',50],['💯','Full-Blown Hero','Read 100 comics.',100],['🏆','Defender','Read 250 comics.',250],['💎','Legend','Read 500 comics.',500],['👑','Avenger','Read 1,000 comics.',1000]];
 let unlocked=0;
 let html=miles.map(m=>{const p=Math.min(100,Math.round(read.length/m[3]*100)),u=read.length>=m[3];if(u)unlocked++;return '<div class="mile '+(u?'unlocked':'')+'"><div>'+m[0]+'</div><div class="mile-name">'+m[1]+'</div><div class="mile-desc">'+m[2]+'</div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><div class="status">'+(u?'✓ Unlocked':read.length+' / '+m[3])+'</div></div>'}).join('');
 const watcher=libs.some(([id])=>{const a=all.filter(x=>x.lib===id);return a.length&&a.every(x=>x.read)});if(watcher)unlocked++;
 html+='<div class="mile '+(watcher?'unlocked':'')+'"><div>🏁</div><div class="mile-name">The Watcher</div><div class="mile-desc">Finish an entire reading order.</div><div class="status">'+(watcher?'✓ Unlocked':'Not yet unlocked')+'</div></div>';
 $('milestones').innerHTML=html;
}
run();
</script></body></html>
